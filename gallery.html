    <!-- 360° VIRTUAL TOUR — shows automatically once you save a 360 photo
         as images/tour.jpg (the equirectangular JPG straight off a Ricoh
         Theta / Insta360 export works as-is). Until that file exists, this
         whole section stays hidden — nothing to configure. -->
    <section class="fade-in" id="tour-section" style="display:none;">
      <h2>Take a Look Inside</h2>
      <p style="color: var(--color-muted); font-size: 14px; margin: -10px 0 16px;">
        Drag to look around — a full 360° view of the space.
      </p>
      <div id="tour" class="tour-viewer"></div>
    </section>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script>
      // Only show the tour if images/tour.jpg actually exists.
      (function () {
        const test = new Image();
        test.onload = function () {
          document.getElementById('tour-section').style.display = '';
          pannellum.viewer('tour', {
            type: 'equirectangular',
            panorama: 'images/tour.jpg',
            autoLoad: true,
            autoRotate: -2,
            showZoomCtrl: false,
            compass: false
          });
        };
        test.src = 'images/tour.jpg';
      })();
    </script>
