    <!-- 360° VIRTUAL TOUR — shows automatically once you save a 360 photo
         as images/tour.jpg (the equirectangular JPG straight off a Ricoh
         Theta / Insta360 export works as-is). Until that file exists, this
         whole section stays hidden — nothing to configure. -->
    <section class="fade-in" id="tour-section">
      <h2>Take a Look Inside</h2>
      <p style="color: var(--color-muted); font-size: 14px; margin: -10px 0 16px;">
        Drag to look around — a full 360° view of the space.
      </p>
      <!-- 360° TOUR
           ─────────────────────────────────────────────────
           DEMO MODE (current): Shows a sample panorama via
             Pannellum's hosted viewer so clients can see
             the feature working right away.

           REAL MODE (once you have a 360 camera):
             1. Export the equirectangular JPG from your camera
             2. Save it as "tour.jpg" in this same folder
             3. Replace the iframe src below with:
                https://pannellum.org/pannellum.htm?panorama=tour.jpg&autoLoad=true&autoRotate=-2
                OR switch back to the JS approach (see pannellum.org docs)
           ─────────────────────────────────────────────────  -->
      <iframe
        class="tour-viewer"
        src="https://pannellum.org/pannellum.htm?panorama=https://pannellum.org/images/cerro-toco-0.jpg&autoLoad=true&autoRotate=-2"
        allowfullscreen
        style="border:0;">
      </iframe>
    </section>
